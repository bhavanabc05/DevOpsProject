name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/whatsapp-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/whatsapp-frontend:${{ github.sha }}
          build-args: |
            VITE_BACKEND_URL=http://localhost:5000

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/whatsapp-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/whatsapp-backend:${{ github.sha }}

      - name: Verify images pushed
        run: |
          echo "✅ Frontend: ${{ secrets.DOCKER_USERNAME }}/whatsapp-frontend:latest"
          echo "✅ Backend: ${{ secrets.DOCKER_USERNAME }}/whatsapp-backend:latest"
          echo "✅ Git SHA: ${{ github.sha }}"
